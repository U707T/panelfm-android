[versions]
agp = "9.3.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
documentfile = "1.1.0"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
commonsNet = "3.13.0"
sshd = "2.20.0"
smbj = "0.13.0"
commonsCompress = "1.27.1"
# commons-compress 1.27.1 传递引入 commons-lang3 3.16.0；3.18.0 以下有
# 「长输入导致非受控递归」告警（GHSA）。显式抬到修复版本（与 bcprov 同一手法）。
commonsLang3 = "3.21.0"
xz = "1.12"
media3 = "1.10.1"
slf4j = "2.0.20"
bcprov = "1.85"
# sora-editor：Android 原生代码编辑器（增量高亮 / 搜索替换 / 虚拟化渲染）。
# ⚠️ 该库为 LGPL-2.1（见 third_party/sora-editor/LICENSE-LGPL-2.1.txt）
soraEditor = "0.24.6"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
commons-net = { module = "commons-net:commons-net", version.ref = "commonsNet" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprov" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }

# 文本编辑器引擎（LGPL-2.1）：editor 为核心控件，language-textmate 提供 TextMate 语法高亮
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "soraEditor" }
sora-language-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "soraEditor" }

junit = { module = "junit:junit", version = "4.13.2" }
# 测试专用：真实 XmlPullParser 实现（Android 内置 KXmlParser 的上游同源代码），驱动解析层样例测试
kxml2 = { module = "net.sf.kxml:kxml2", version = "2.3.0" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
