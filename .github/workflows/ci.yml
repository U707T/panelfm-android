name: ci

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 同一分支连续推送时取消旧任务，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 单元测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

  # ------------------------------------------------------------------ 构建 APK
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK components (compileSdk 37)
        continue-on-error: true
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || true
          fi
      # 签名：key.properties / keystore 来自仓库 secrets。
      # ⚠️ 缺 keystore 时 **release 构建会硬失败**（见 app/build.gradle.kts 的 taskGraph.whenReady：
      # 只出 release 时才校验，testDebugUnitTest 不受影响）—— 这是故意的：禁止发布 debug 签名的 release APK。
      - name: Decode keystore
        continue-on-error: true
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks
      - name: Write key.properties
        continue-on-error: true
        run: |
          test -s keystore.jks || exit 0
          {
            echo "storeFile=../keystore.jks"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > key.properties
      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace
      # 分 ABI 出包：debug / release 各 3 个；文件名沿用发布命名，缺失直接报错（不再静默）
      - name: Rename APKs
        run: |
          set -e
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "out/PanelFM-debug-${abi}.apk"
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "out/PanelFM-release-${abi}.apk"
          done
          ls -la out
      # Android 15+ 16KB 页大小兼容：APK 内 .so 必须 STORED 且 16KB 对齐、ELF LOAD 段 ≥ 16KB。
      # 与 mp4fix 的发布硬门槛一致，防止依赖升级后回归。
      - name: Verify 16 KB page-size compatibility (Android 15+)
        run: |
          python3 - <<'PY'
          import glob, os, struct, subprocess, sys, tempfile, zipfile

          bad = []
          apks = sorted(glob.glob('out/PanelFM-*.apk'))
          if not apks:
              print('未找到 APK'); sys.exit(1)

          def check_elf(p, apk, name):
              out = subprocess.check_output(['readelf', '-lW', p], text=True)
              for line in out.splitlines():
                  if line.strip().startswith('LOAD'):
                      align = int(line.split()[-1], 16)
                      if align < 0x4000:
                          bad.append((apk, name, 'ELF LOAD align', hex(align)))

          with tempfile.TemporaryDirectory() as td:
              for apk in apks:
                  with zipfile.ZipFile(apk) as z:
                      for info in z.infolist():
                          if not (info.filename.startswith('lib/') and info.filename.endswith('.so')):
                              continue
                          z.fp.seek(info.header_offset)
                          hdr = z.fp.read(30)
                          name_len, extra_len = struct.unpack('<HH', hdr[26:30])
                          data_off = info.header_offset + 30 + name_len + extra_len
                          if info.compress_type != 0:
                              bad.append((apk, info.filename, 'not STORED', info.compress_type))
                          elif data_off % 16384 != 0:
                              bad.append((apk, info.filename, 'zip align', data_off % 16384))
                          z.extract(info.filename, td)
                          check_elf(os.path.join(td, info.filename), apk, info.filename)

          if bad:
              print('16KB 兼容检查失败：')
              for b in bad:
                  print('  ', b)
              sys.exit(1)
          print(f'16KB 兼容检查通过：{len(apks)} 个 APK 的 .so 均 STORED + 16KB 对齐 + ELF LOAD ≥ 16KB')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PanelFM-apks
          path: out/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ 发布
  # 仅当 app/build.gradle.kts 的 versionName 还没有对应 tag 时创建 Release
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PanelFM-apks
          path: apks
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 版本号带 -rc 后缀 → 预发布（prerelease），与 IRIS / mp4fix 的发版约定一致
          FLAGS=""
          case "$VERSION" in
            *-rc*) FLAGS="--prerelease" ;;
          esac
          # Release 备注 = 只放 **CHANGELOG.md 里本版本的段落**（“新增/修复”要点；不带通用说明两行）
          NOTES_FILE="release_notes.md"
          {
            if [ -n "$FLAGS" ]; then
              echo "> 预发布 RC：版本号含 -rc 后缀"
              echo ""
            fi
            # 提取本版本段落：从 `## v$VERSION` 到下一个 `## ` 标题前
            awk -v ver="## v$VERSION" '
              index($0, ver) == 1 { f=1; next }
              f && /^## / { exit }
              f { print }
            ' CHANGELOG.md > section.md
            if [ -s section.md ]; then
              echo "## 本次修复 / 更新"
              echo ""
              cat section.md
            else
              echo "（CHANGELOG.md 里未找到 v$VERSION 段落）"
            fi
          } > "$NOTES_FILE"
          gh release create "${{ steps.version.outputs.tag }}" \
            apks/PanelFM-release-*.apk \
            --title "PanelFM ${{ steps.version.outputs.tag }}" \
            --notes-file "$NOTES_FILE" \
            $FLAGS \
            --target main
