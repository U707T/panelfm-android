name: ci

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ 单元测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

  # ------------------------------------------------------------------ 构建 APK
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK components (compileSdk 37)
        continue-on-error: true
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || true
          fi
      # 签名：key.properties / keystore 来自仓库 secrets；缺失时自动回退 debug 签名，构建不中断
      - name: Decode keystore
        continue-on-error: true
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks
      - name: Write key.properties
        continue-on-error: true
        run: |
          test -s keystore.jks || exit 0
          {
            echo "storeFile=../keystore.jks"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > key.properties
      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/PanelFM-debug-universal.apk || true
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/PanelFM-release-arm64-v8a.apk || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/PanelFM-release-armeabi-v7a.apk || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk out/PanelFM-release-x86_64.apk || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PanelFM-apks
          path: out/*.apk

  # ------------------------------------------------------------------ 发布
  # 仅当 app/build.gradle.kts 的 versionName 还没有对应 tag 时创建 Release
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PanelFM-apks
          path: apks
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            apks/*.apk \
            --title "PanelFM ${{ steps.version.outputs.tag }}" \
            --notes "自动构建：Android 原生 Kotlin 版 PanelFM（双列文件管理器）。仅文件管理与预览，不含任何逆向功能。" \
            --target main
